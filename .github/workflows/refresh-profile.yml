name: Refresh GitHub profile graphic

on:
  schedule:
    - cron: "17 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.PROFILE_REPO_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check profile token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Set PROFILE_REPO_TOKEN to a token that can read the source repos and write mileslow/mileslow." >&2
            exit 1
          fi

      - name: Check GitHub API quota
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          for label, token in {
              "PROFILE_REPO_TOKEN": os.environ["GH_TOKEN"],
              "ACTIONS_GITHUB_TOKEN": os.environ.get("GITHUB_TOKEN", ""),
          }.items():
              if not token:
                  continue
              request = urllib.request.Request(
                  "https://api.github.com/rate_limit",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "github-line-velocity",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      quota = json.load(response)["resources"]["core"]
                  print(f"{label} quota before scan: {quota['remaining']}/{quota['limit']}")
              except urllib.error.HTTPError as error:
                  print(f"{label} quota check returned HTTP {error.code}; scan will report the detailed error.")
          PY

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run regression tests
        run: python -m unittest discover --start-directory tests --verbose

      - uses: actions/cache/restore@v6
        with:
          path: .cache/commit-stats-v2
          key: commit-stats-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: commit-stats-v2-

      - name: Generate the latest 365-day snapshot
        id: generate
        run: |
          python -u scripts/generate_profile.py \
            --output-dir generated \
            --stats-path data/latest.json \
            --model-usage-path data/model_usage.json \
            --username mileslow \
            --profile-repo mileslow/mileslow \
            --generator-repo mileslow/github-line-velocity \
            --workers 2

      - uses: actions/cache/save@v6
        if: always() && steps.generate.outcome != 'skipped'
        with:
          path: .cache/commit-stats-v2
          key: commit-stats-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report a blocked refresh
        if: failure()
        run: |
          echo '::error::Refresh failed. The previous published snapshot is preserved; see the failing step for the cause.'
          echo 'The profile refresh did not complete. The previous public snapshot was preserved.' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the aggregate snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/github-line-velocity.svg data/latest.json data/model_usage.json
          if git diff --cached --quiet; then
            echo "No generator changes to commit."
            exit 0
          fi
          git commit -m "Refresh 365-day GitHub line velocity"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          echo 'Could not push the aggregate snapshot after three attempts.' >&2
          exit 1

      - name: Publish the profile SVG
        run: |
          python scripts/publish_profile.py \
            --svg generated/github-line-velocity.svg \
            --repo mileslow/mileslow \
            --path assets/github-line-velocity.svg
