name: Refresh GitHub profile graphic

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.PROFILE_REPO_TOKEN }}
    steps:
      - name: Check profile token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Set PROFILE_REPO_TOKEN to a token that can read the source repos and write mileslow/mileslow." >&2
            exit 1
          fi

      - name: Check GitHub API quota
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          request = urllib.request.Request(
              "https://api.github.com/rate_limit",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "github-line-velocity",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  quota = json.load(response)["resources"]["core"]
              print(f"GitHub API quota before scan: {quota['remaining']}/{quota['limit']}")
          except urllib.error.HTTPError as error:
              print(f"GitHub API quota check returned HTTP {error.code}; scan will report the detailed error.")
          PY

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the latest 365-day snapshot
        run: |
          python scripts/generate_profile.py \
            --output-dir generated \
            --stats-path data/latest.json \
            --username mileslow \
            --profile-repo mileslow/mileslow \
            --generator-repo mileslow/github-line-velocity \
            --workers 2

      - name: Publish the profile SVG
        run: |
          python scripts/publish_profile.py \
            --svg generated/github-line-velocity.svg \
            --repo mileslow/mileslow \
            --path assets/github-line-velocity.svg

      - name: Commit the aggregate snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/github-line-velocity.svg data/latest.json
          if git diff --cached --quiet; then
            echo "No generator changes to commit."
            exit 0
          fi
          git commit -m "Refresh 365-day GitHub line velocity"
          git push
